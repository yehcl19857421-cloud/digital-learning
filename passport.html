<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位學習護照</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 340px; text-align: center; }
    .user-info { background: #eef2ff; padding: 15px; border-radius: 8px; margin: 20px 0; color: #2563eb; font-weight: bold; font-size: 1.2rem; }
    .badge { background-color: #d1fae5; color: #065f46; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; display: inline-block; }
    button { background: #6b7280; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📜 個人數位學習護照</h2>
    <div class="badge">✓ 身分驗證成功</div>
    <div class="user-info">歡迎，<span id="userName">載入中...</span>！</div>
    <p style="color: #666; font-size: 0.95rem;">這是您的數位學習護照頁面。</p>
    <button onclick="logout()">重新查詢 / 登出</button>
  </div>

  <script>
    window.onload = function() {
      // 1. 優先從網址參數抓姓名 (?name=葉建良)
      const urlParams = new URLSearchParams(window.location.search);
      let name = urlParams.get('name');

      // 2. 抓不到再從 localStorage 備份抓
      if (!name) {
        const stored = localStorage.getItem("userData");
        if (stored) {
          try { name = JSON.parse(stored).name; } catch(e){}
        }
      }

      // 3. 都沒有才顯示警告並踢回首頁
      if (!name) {
        alert("未完成身分驗證，請先登入！");
        window.location.href = "index.html";
        return;
      }

      // 順利顯示名字
      document.getElementById("userName").innerText = name;
      localStorage.setItem("userData", JSON.stringify({ name: name }));
    };

    function logout() {
      localStorage.removeItem("userData");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
