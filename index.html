<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位學習護照</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-bottom: 25px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e0e0e0;
      background-color: #f8f9fa;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-control:focus {
      border-color: #3b82f6;
      background-color: #fff;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      background-color: #2563eb;
    }
    .btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .result-box.success {
      display: block;
      background-color: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }
    .result-box.error {
      display: block;
      background-color: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">個人數位學習護照</div>

    <div class="input-group">
      <input type="text" id="account" class="input-control" placeholder="請輸入姓名" autocomplete="off" />
    </div>

    <div class="input-group">
      <input type="password" id="password" class="input-control" placeholder="請輸入密碼 / 身分證" autocomplete="off" />
    </div>

    <button type="button" class="btn" id="submitBtn" onclick="queryPassport()">🔍 開始查詢</button>

    <div id="result" class="result-box"></div>
  </div>

  <script>
    // ⚠️ 請將下方的網址替換為你實際部署的 Google Apps Script 網址 (結尾必須是 /exec)
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCRauz5wCnKLt-Fgvn7m8sjV2Rm6CYT9GGY8NtFn1qxFJ69q4Um3BpnV6LIX_zQZra/exec";

    async function queryPassport() {
      const accountEl = document.getElementById('account');
      const passwordEl = document.getElementById('password');
      const btn = document.getElementById('submitBtn');
      const resultDiv = document.getElementById('result');

      const accountInput = accountEl.value.trim();
      const passwordInput = passwordEl.value.trim();

      // 清空結果狀態
      resultDiv.className = "result-box";
      resultDiv.innerText = "";

      // 1. 前端初步欄位檢查
      if (!accountInput || !passwordInput) {
        showResult("請輸入姓名與密碼！", "error");
        return;
      }

      // 2. 開啟載入狀態
      btn.disabled = true;
      btn.innerText = "連線中...";

      // 3. 組合 GET URL
      const requestUrl = `${GAS_WEB_APP_URL}?action=login&account=${encodeURIComponent(accountInput)}&password=${encodeURIComponent(passwordInput)}`;

      try {
        const response = await fetch(requestUrl, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) {
          throw new Error(`HTTP 錯誤，狀態碼: ${response.status}`);
        }

        const data = await response.json();

        if (data.status === "success") {
          showResult(`✅ ${data.message}`, "success");
        } else {
          showResult(`❌ ${data.message}`, "error");
        }

      } catch (error) {
        console.error("Fetch Error:", error);
        showResult("❌ 連線失敗：無法連接至伺服器，請檢查權限設定或 API 網址。", "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "🔍 開始查詢";
      }
    }

    function showResult(message, type) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = message;
      resultDiv.className = `result-box ${type}`;
    }
  </script>

</body>
</html>
