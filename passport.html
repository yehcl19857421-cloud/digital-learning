<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位學習護照</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 360px;
      text-align: center;
    }
    h2 { color: #333; margin-bottom: 20px; }
    .user-info {
      background: #eef2ff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #2563eb;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .status-badge {
      display: inline-block;
      background-color: #d1fae5;
      color: #065f46;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .btn-back {
      background-color: #6b7280;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-back:hover { background-color: #4b5563; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📜 個人數位學習護照</h2>
    
    <div class="user-info">
      歡迎，<span id="userName">載入中...</span>！
    </div>

    <div class="status-badge">
      ✓ 驗證身分成功
    </div>

    <p style="color: #666; line-height: 1.6;">
      您已順利登入數位學習護照系統，此處可載入並顯示您的教育訓練與研習紀錄。
    </p>

    <br>
    <button class="btn-back" onclick="logout()">重新查詢 / 登出</button>
  </div>

  <script>
    // 頁面載入時讀取 localStorage 中的使用者姓名
    window.onload = function() {
      const userDataRaw = localStorage.getItem("userData");
      
      if (!userDataRaw) {
        alert("未完成身分驗證，請先登入！");
        window.location.href = "index.html";
        return;
      }

      const userData = JSON.parse(userDataRaw);
      document.getElementById("userName").innerText = userData.name || "學員";
    };

    // 登出並清除暫存資料
    function logout() {
      localStorage.removeItem("userData");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
