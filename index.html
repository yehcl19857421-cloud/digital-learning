<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位學習護照</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #2b303a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #3f4652;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      color: #ffffff;
      text-align: center;
    }

    .card h2 {
      margin-bottom: 25px;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #5a6270;
      border-radius: 8px;
      background-color: #2b303a;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #4c8bf5;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #3b66bc;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2e54a1;
    }

    .btn:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
    }

    .result-box.success {
      background-color: #1e4620;
      border: 1px solid #2e7d32;
      color: #e8f5e9;
    }

    .result-box.error {
      background-color: #4a151b;
      border: 1px solid #c62828;
      color: #ffebee;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>個人數位學習護照</h2>
    
    <div class="input-group">
      <input type="text" id="account" placeholder="姓名 / 帳號" autocomplete="off">
    </div>
    
    <div class="input-group">
      <input type="password" id="password" placeholder="身分證 / 密碼" autocomplete="off">
    </div>

    <button class="btn" id="submitBtn" onclick="queryPassport()">🔍 開始查詢</button>

    <div id="result" class="result-box"></div>
  </div>

  <script>
    // ⚠️ 請將下方的網址替換為你實際部署的 Google Apps Script Web App 網址 (/exec 結尾)
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCRauz5wCnKLt-Fgvn7m8sjV2Rm6CYT9GGY8NtFn1qxFJ69q4Um3BpnV6LIX_zQZra/exec";

    async function queryPassport() {
      const accountInput = document.getElementById('account').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const btn = document.getElementById('submitBtn');
      const resultDiv = document.getElementById('result');

      // 1. 前端初步驗證
      if (!accountInput || !passwordInput) {
        alert("請輸入帳號與密碼！");
        return;
      }

      if (GAS_WEB_APP_URL.includes("你的部署ID")) {
        alert("請先在 HTML 程式碼中將 GAS_WEB_APP_URL 替換為你的 Google Apps Script 網址！");
        return;
      }

      // 2. 切換按鈕狀態
      btn.disabled = true;
      btn.innerText = "查詢中...";
      resultDiv.style.display = "none";

      try {
        // 3. 組成包含網址編碼的 API URL
        const targetUrl = `${GAS_WEB_APP_URL}?action=login&account=${encodeURIComponent(accountInput)}&password=${encodeURIComponent(passwordInput)}`;

        // 4. 發送請求
        const response = await fetch(targetUrl);
        const data = await response.json();

        // 5. 處理結果
        if (data.status === "success") {
          resultDiv.className = "result-box success";
          resultDiv.innerHTML = `
            <strong>🎉 查詢成功</strong><br>
            <strong>姓名：</strong> ${data.data.name}<br>
            <strong>編號：</strong> ${data.data.id}<br>
            <strong>時間：</strong> ${data.data.timestamp}
          `;
          resultDiv.style.display = "block";
        } else {
          resultDiv.className = "result-box error";
          resultDiv.innerHTML = `<strong>❌ 查詢失敗：</strong> ${data.message}`;
          resultDiv.style.display = "block";
        }
      } catch (error) {
        console.error("Fetch 錯誤:", error);
        alert("連線失敗，請檢查網路或確認後端部署網址是否正確。");
      } finally {
        btn.disabled = false;
        btn.innerText = "🔍 開始查詢";
      }
    }
  </script>
</body>
</html>
